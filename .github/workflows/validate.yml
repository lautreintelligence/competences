name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.0"
      - name: Validate skills and templates
        run: uv run --python 3.11 scripts/validate-skills.py
      - name: Run regression tests
        run: uv run --python 3.11 --with pyyaml==6.0.3 python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate plugin versions
        run: uv run --python 3.11 scripts/validate-releases.py
      - name: Require version increments in pull requests
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --python 3.11 scripts/validate-releases.py --base-ref "$RELEASE_BASE"
